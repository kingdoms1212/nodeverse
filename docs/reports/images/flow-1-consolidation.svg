<text class="t" x="762" y="408">silver_audit → silver.quarantine</text>
<text class="s" x="762" y="430">id_conflict · invalid_json · invalid_schema</text>
<rect class="box" x="748" y="452" width="384" height="76" rx="10"/>
<text class="t" x="762" y="478">gold_1m · gold_alert · gold_update</text>
<text class="s" x="762" y="500">1분·5분 집계 → Delta MERGE(창 하한)</text>
<text class="s" x="762" y="519">→ MongoDB rt_* upsert</text>
