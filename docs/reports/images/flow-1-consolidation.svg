<text class="s" x="274" y="788">수집기: 401 키 · 413 16KiB · 422 + DLQ · 503 Kafka (최대 12초 대기)</text>
<text class="s" x="274" y="807">Spark: 같은 ID 다른 내용 → quarantine · 쿼리 하나 실패 → 전체 재시작 · Mongo 쓰기 재시도 없음</text>
<text class="s" x="274" y="826">원격 작업자: 회원 매핑·순서 빈칸 → waiting_context 무한 재시도 · 일시 오류 → retrying 무한</text>
