<rect x="0" y="0" width="1800" height="1060" fill="#fff"/>
<text x="30" y="42" font-size="24" font-weight="700" fill="#1f2430">① 공용 git 정리 시점 — 파이프라인 처리 흐름</text>
<text x="30" y="68" class="s">NVG feature/codex-v2-remote-sink 32b0248 · 결정 기록 D1~D29 반영 상태 · 빨간 글씨 = 문제 지점</text>
