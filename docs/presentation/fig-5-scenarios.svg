<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f4f"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b78c2"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="60" y="78" font-size="44" font-weight="800" fill="#1f2430">⑤ 장애·예외 상황 대응 비교</text><text x="60" y="122" font-size="22" fill="#5b6472">로컬 스택에서 직접 재현해 확인한 결과</text><rect x="60" y="170" width="1800" height="60" rx="10" fill="#1f4d39"/><text x="90" y="210" font-size="24" font-weight="700" fill="#fff" text-anchor="start" xml:space="preserve">상황</text><text x="560" y="210" font-size="24" font-weight="700" fill="#fff" text-anchor="start" xml:space="preserve">처음 구조</text><text x="1180" y="210" font-size="24" font-weight="700" fill="#fff" text-anchor="start" xml:space="preserve">현재 구조</text><rect x="60" y="240" width="1800" height="84" rx="8" fill="#f6f8f9" stroke="#e1e5ea"/><text x="90" y="290" font-size="23" font-weight="700" fill="#1f2430" text-anchor="start" xml:space="preserve">MongoDB 30~130초 정지</text><text x="560" y="290" font-size="21" font-weight="400" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ rt_* 쓰기 실패 → 쿼리 실패 → 앱 전체 재시작</text><text x="1180" y="290" font-size="21" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 수집 202 유지, 실패한 Gold 창 자동 재게시, 재시작 0</text><rect x="60" y="330" width="1800" height="84" rx="8" fill="#ffffff" stroke="#e1e5ea"/><text x="90" y="380" font-size="23" font-weight="700" fill="#1f2430" text-anchor="start" xml:space="preserve">Spark 쿼리 하나 실패</text><text x="560" y="380" font-size="21" font-weight="400" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ Bronze 수집까지 전체 정지</text><text x="1180" y="380" font-size="21" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 그 쿼리만 체크포인트에서 재시작</text><rect x="60" y="420" width="1800" height="84" rx="8" fill="#f6f8f9" stroke="#e1e5ea"/><text x="90" y="470" font-size="23" font-weight="700" fill="#1f2430" text-anchor="start" xml:space="preserve">Kafka 브로커 1대 정지·동결</text><text x="560" y="470" font-size="21" font-weight="400" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 포트·JVM CLI로만 확인</text><text x="1180" y="470" font-size="21" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 해당 브로커만 3초 안 이상 표시, 수집 준비 유지</text><rect x="60" y="510" width="1800" height="84" rx="8" fill="#ffffff" stroke="#e1e5ea"/><text x="90" y="560" font-size="23" font-weight="700" fill="#1f2430" text-anchor="start" xml:space="preserve">같은 이벤트 재전송</text><text x="560" y="560" font-size="21" font-weight="400" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ Silver 중복 제거만 (단계별 검증 기록 없음)</text><text x="1180" y="560" font-size="21" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ Bronze 이력 보존 · Silver 1행 · Gold 값 불변 확인</text><rect x="60" y="600" width="1800" height="84" rx="8" fill="#f6f8f9" stroke="#e1e5ea"/><text x="90" y="650" font-size="23" font-weight="700" fill="#1f2430" text-anchor="start" xml:space="preserve">며칠 늦게 도착한 기록</text><text x="560" y="650" font-size="21" font-weight="400" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 경고·버전 보급률 왜곡, MERGE 범위 확대</text><text x="1180" y="650" font-size="21" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 총계 포함·따로 표시, 경고 제외, MERGE 분리</text><rect x="60" y="690" width="1800" height="84" rx="8" fill="#ffffff" stroke="#e1e5ea"/><text x="90" y="740" font-size="23" font-weight="700" fill="#1f2430" text-anchor="start" xml:space="preserve">원격 적재 대기·재시도</text><text x="560" y="740" font-size="21" font-weight="400" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 기한 없이 무한 재시도 (CPU 143%)</text><text x="1180" y="740" font-size="21" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 기한 후 parked, 자동 재개, 재처리 예산</text><rect x="60" y="780" width="1800" height="84" rx="8" fill="#f6f8f9" stroke="#e1e5ea"/><text x="90" y="830" font-size="23" font-weight="700" fill="#1f2430" text-anchor="start" xml:space="preserve">유입이 초당 200건으로 몰릴 때</text><text x="560" y="830" font-size="21" font-weight="400" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 초당 17~24건 (8차 직전에도 57건, 대기 48.8초)</text><text x="1180" y="830" font-size="21" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 초당 193~219건으로 따라감, 평균 대기 2.9초</text><rect x="60" y="870" width="1800" height="84" rx="8" fill="#ffffff" stroke="#e1e5ea"/><text x="90" y="920" font-size="23" font-weight="700" fill="#1f2430" text-anchor="start" xml:space="preserve">운영자 park ↔ 작업자 선점</text><text x="560" y="920" font-size="21" font-weight="400" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 처리돼 버림</text><text x="1180" y="920" font-size="21" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 선점 토큰: park가 이김, 늦은 결과 무시</text><rect x="60" y="960" width="1800" height="84" rx="8" fill="#f6f8f9" stroke="#e1e5ea"/><text x="90" y="1010" font-size="23" font-weight="700" fill="#1f2430" text-anchor="start" xml:space="preserve">원격 DB 교체·복원</text><text x="560" y="1010" font-size="21" font-weight="400" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 원본 없이 완료 처리 가능</text><text x="1180" y="1010" font-size="21" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 시도마다 원본 확인·재기록</text></svg>