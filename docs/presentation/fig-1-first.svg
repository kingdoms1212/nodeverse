<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f4f"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b78c2"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="60" y="78" font-size="44" font-weight="800" fill="#1f2430">① 처음 구조 (공용 git 정리 시점)</text><text x="60" y="122" font-size="22" fill="#5b6472">2026-11-20 · NVG remote-sink 브랜치 · 빨간 글씨 = 실측·코드로 확인한 문제 지점</text><rect x="60" y="170" width="340" height="330" rx="14" fill="#fdf3e3" stroke="#d08a2c" stroke-width="2.5"/><text x="78" y="208" font-size="24" font-weight="700" fill="#7a4a0c" text-anchor="start" xml:space="preserve">게임 (Godot)</text><text x="80" y="244" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">학습·업데이트·런처 이벤트</text><text x="80" y="274" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">디스크 큐 → HTTP 전송</text><text x="80" y="304" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 4xx 하나가 큐 전체를 막음</text><text x="80" y="334" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 401 영구 거부, 6일 초과 전송</text><text x="80" y="364" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ UUIDv4 (시간순 아님)</text><rect x="450" y="170" width="360" height="330" rx="14" fill="#e8f1fb" stroke="#3b78c2" stroke-width="2.5"/><text x="468" y="208" font-size="24" font-weight="700" fill="#1d4d86" text-anchor="start" xml:space="preserve">수집기 (FastAPI)</text><text x="470" y="244" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">검증 → Kafka → 202 / 422+DLQ</text><text x="470" y="274" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ Kafka 장애 시 요청당 12초 대기</text><text x="470" y="304" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 폴링 스레드 예외 무방비</text><text x="470" y="334" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 상태 조회 Mongo 장애 = 500</text><rect x="860" y="170" width="420" height="330" rx="14" fill="#eef0fb" stroke="#5560b8" stroke-width="2.5"/><text x="878" y="208" font-size="24" font-weight="700" fill="#2d357a" text-anchor="start" xml:space="preserve">Kafka 3대 (KRaft)</text><text x="880" y="244" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">토픽 5개 · 복제 3 · 최소 ISR 2</text><text x="880" y="274" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">보관 7일</text><text x="880" y="304" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 헬스체크 = 10초마다 JVM CLI</text><text x="880" y="334" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">  (브로커당 CPU 최대 150%)</text><text x="880" y="364" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ topic-init도 JVM CLI</text><rect x="60" y="550" width="1220" height="290" rx="14" fill="#eaf6ef" stroke="#2f8a57" stroke-width="2.5"/><text x="78" y="588" font-size="24" font-weight="700" fill="#1d5a38" text-anchor="start" xml:space="preserve">Spark + Delta (단일 앱)</text><text x="80" y="624" font-size="20" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">Bronze append → Silver 중복 제거 + MERGE → Gold 1분·5분 창 → MongoDB rt_*</text><text x="80" y="655" font-size="20" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 한 파일 484줄, 쿼리 하나 실패 = 앱 전체 정지 · rt_* 쓰기 재시도 없음</text><text x="80" y="686" font-size="20" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ Silver MERGE 조건 event_id 하나 → 매 배치 전체 스캔 · outbox 이벤트당 Mongo 2회</text><text x="80" y="717" font-size="20" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 자동 압축이 매 커밋 파티션 전체 재작성 (실데이터 30MB → 디스크 4.9GB)</text><text x="80" y="748" font-size="20" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 늦게 도착한 기록이 실시간 경고·버전 보급률을 왜곡</text><rect x="60" y="880" width="1220" height="170" rx="14" fill="#fbeef0" stroke="#b8506a" stroke-width="2.5"/><text x="78" y="918" font-size="24" font-weight="700" fill="#7a2238" text-anchor="start" xml:space="preserve">원격 작업자 → MySQL·대시보드 MongoDB</text><text x="80" y="954" font-size="20" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 1건씩, 매 건 MySQL 새 연결 + GET_LOCK → 초당 17~24건 (유입의 1/8)</text><text x="80" y="985" font-size="20" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 대기·재시도 기한 없음, blocked 안 보임, outbox 무한 증가</text><rect x="1330" y="170" width="530" height="670" rx="14" fill="#e9f6f6" stroke="#2b8a8a" stroke-width="2.5"/><text x="1348" y="208" font-size="24" font-weight="700" fill="#145a5a" text-anchor="start" xml:space="preserve">관리자 서버 (Django)</text><text x="1350" y="244" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">실시간 현황 (rt_*, 3초)</text><text x="1350" y="274" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">전체 현황·게임 분석·플레이어</text><text x="1350" y="304" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve"></text><text x="1350" y="334" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 적재 상태·거절 이벤트를</text><text x="1350" y="364" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">  볼 화면 없음</text><text x="1350" y="394" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ /staff/ 참조 누락 시 500</text><rect x="1330" y="880" width="530" height="170" rx="14" fill="#f4f5f7" stroke="#7b8494" stroke-width="2.5"/><text x="1348" y="918" font-size="24" font-weight="700" fill="#3b4250" text-anchor="start" xml:space="preserve">운영 도구</text><text x="1350" y="954" font-size="19" font-weight="600" fill="#c0392b" text-anchor="start" xml:space="preserve">⚠ 수동 확인뿐</text><path d="M400,330 L450,330" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><path d="M810,330 L860,330" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><path d="M1070,500 L1070,550" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><path d="M670,840 L670,880" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><path d="M1280,640 L1330,640" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><text x="1305" y="626" font-size="18" font-weight="700" fill="#2f6f4f" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">rt_*</text><path d="M1280,960 L1330,960" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/></svg>