<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f4f"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b78c2"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="60" y="78" font-size="44" font-weight="800" fill="#1f2430">② 현재 구조 (1~8차 보완 후)</text><text x="60" y="122" font-size="22" fill="#5b6472">2026-11-21 · 1~8차 · 초록 글씨 = 바뀐 부분 · 처리 경로(Kafka→Bronze→Silver→Gold→rt_*→원격 적재)는 그대로</text><rect x="60" y="170" width="340" height="330" rx="14" fill="#fdf3e3" stroke="#d08a2c" stroke-width="2.5"/><text x="78" y="208" font-size="24" font-weight="700" fill="#7a4a0c" text-anchor="start" xml:space="preserve">게임 (Godot)</text><text x="80" y="244" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">학습·업데이트·런처 이벤트</text><text x="80" y="274" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">디스크 큐 → HTTP 전송</text><text x="80" y="304" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 응답별 재시도·만료</text><text x="80" y="334" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ UUIDv7 (시간순 ID)</text><text x="80" y="364" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 원자적 큐 쓰기, 계정별 세션</text><rect x="450" y="170" width="360" height="330" rx="14" fill="#e8f1fb" stroke="#3b78c2" stroke-width="2.5"/><text x="468" y="208" font-size="24" font-weight="700" fill="#1d4d86" text-anchor="start" xml:space="preserve">수집기 (FastAPI)</text><text x="470" y="244" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">검증 → Kafka → 202 / 422+DLQ</text><text x="470" y="274" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 대기 5초, 폴링 스레드 보호</text><text x="470" y="304" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ /health/ready = 수집 준비</text><text x="470" y="334" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ /health/deps 브로커별 진단</text><rect x="860" y="170" width="420" height="330" rx="14" fill="#eef0fb" stroke="#5560b8" stroke-width="2.5"/><text x="878" y="208" font-size="24" font-weight="700" fill="#2d357a" text-anchor="start" xml:space="preserve">Kafka 3대 (KRaft)</text><text x="880" y="244" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">토픽 5개 · 복제 3 · 최소 ISR 2</text><text x="880" y="274" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">보관 7일</text><text x="880" y="304" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 생존 nc + Python 프로토콜 검사</text><text x="880" y="334" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ topic-init AdminClient·재시도</text><text x="880" y="364" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ deps-ready 기동 관문</text><rect x="60" y="550" width="1220" height="290" rx="14" fill="#eaf6ef" stroke="#2f8a57" stroke-width="2.5"/><text x="78" y="588" font-size="24" font-weight="700" fill="#1d5a38" text-anchor="start" xml:space="preserve">Spark + Delta (단일 앱)</text><text x="80" y="624" font-size="20" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">Bronze append → Silver 중복 제거 + MERGE → Gold 1분·5분 창 → MongoDB rt_*</text><text x="80" y="655" font-size="20" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 모듈 분리, 실패한 쿼리만 재시작, sink 재시도, Gold 게시 실패 창 재게시</text><text x="80" y="686" font-size="20" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ MERGE: 날짜 7일 + v7 ID 범위 + ID 생성일별 분리 · outbox 500건 bulk</text><text x="80" y="717" font-size="20" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 자동 압축 끔 → 300배치마다 작은 파일만 + VACUUM (별도 스레드)</text><text x="80" y="748" font-size="20" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 늦게 도착 건수 표시, 경고는 정시 이벤트만, 거절·격리(DLQ) 집계</text><rect x="60" y="880" width="1220" height="170" rx="14" fill="#fbeef0" stroke="#b8506a" stroke-width="2.5"/><text x="78" y="918" font-size="24" font-weight="700" fill="#7a2238" text-anchor="start" xml:space="preserve">원격 작업자 → MySQL·대시보드 MongoDB</text><text x="80" y="954" font-size="20" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 묶음·세션 병렬·풀 + 왕복 26→10회·순번 역전 해결 → 초당 219건 (유입 따라감)</text><text x="80" y="985" font-size="20" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 기한 후 parked, 상태 카드, 완료 행 30일 TTL, 상태 집계는 인덱스만</text><rect x="1330" y="170" width="530" height="670" rx="14" fill="#e9f6f6" stroke="#2b8a8a" stroke-width="2.5"/><text x="1348" y="208" font-size="24" font-weight="700" fill="#145a5a" text-anchor="start" xml:space="preserve">관리자 서버 (Django)</text><text x="1350" y="244" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">실시간 현황 (rt_*, 3초)</text><text x="1350" y="274" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">전체 현황·게임 분석·플레이어</text><text x="1350" y="304" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve"></text><text x="1350" y="334" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 1분 전 대비 ▲▼ 추세</text><text x="1350" y="364" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 분석 화면 적재 상태 카드</text><text x="1350" y="394" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 거절·격리 이벤트 카드</text><text x="1350" y="424" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 늦게 도착 N건 표시</text><text x="1350" y="454" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 실시간 = 도착 시각,</text><text x="1350" y="484" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">   분석 = 플레이 시각 (명시)</text><text x="1350" y="514" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ 참조 누락에도 500 없음</text><rect x="1330" y="880" width="530" height="170" rx="14" fill="#f4f5f7" stroke="#7b8494" stroke-width="2.5"/><text x="1348" y="918" font-size="24" font-weight="700" fill="#3b4250" text-anchor="start" xml:space="preserve">운영 도구</text><text x="1350" y="954" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ requeue · dlq_peek · health</text><text x="1350" y="984" font-size="19" font-weight="600" fill="#2f8a57" text-anchor="start" xml:space="preserve">✔ dummy_data · probe_latency</text><path d="M400,330 L450,330" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><path d="M810,330 L860,330" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><path d="M1070,500 L1070,550" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><path d="M670,840 L670,880" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><path d="M1280,640 L1330,640" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><text x="1305" y="626" font-size="18" font-weight="700" fill="#2f6f4f" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">rt_*</text><path d="M1280,960 L1330,960" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/></svg>