<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f4f"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b78c2"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="60" y="78" font-size="44" font-weight="800" fill="#1f2430">⑥ 원격 적재가 느렸던 진짜 원인: 순번 역전 선점</text><text x="60" y="122" font-size="22" fill="#5b6472">8차 보완 · 세션 안 이벤트는 순번대로만 적재해야 함 (2번보다 3번이 먼저 들어가면 기록이 꼬임)</text><rect x="50" y="160" width="890" height="880" rx="16" fill="#fff7f6" stroke="#c0392b" stroke-width="2.5"/><text x="80" y="205" font-size="28" font-weight="800" fill="#c0392b" text-anchor="start" xml:space="preserve">이전: 500건 묶음마다 다른 적재 시각</text><text x="80" y="260" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">Silver 한 배치(1초)를 500건씩 끊어 outbox에 넣음</text><text x="80" y="330" font-size="21" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">묶음 1 · 12:00:00.425</text><rect x="330" y="300" width="120" height="54" rx="10" fill="#f4f5f7" stroke="#7b8494" stroke-width="2.5"/><text x="390" y="335" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #1</text><rect x="470" y="300" width="120" height="54" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="530" y="335" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #3</text><rect x="610" y="300" width="120" height="54" rx="10" fill="#f4f5f7" stroke="#7b8494" stroke-width="2.5"/><text x="670" y="335" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">B #1</text><text x="80" y="420" font-size="21" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">묶음 2 · 12:00:00.447</text><rect x="330" y="390" width="120" height="54" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="390" y="425" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #2</text><rect x="470" y="390" width="120" height="54" rx="10" fill="#f4f5f7" stroke="#7b8494" stroke-width="2.5"/><text x="530" y="425" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #4</text><rect x="610" y="390" width="120" height="54" rx="10" fill="#f4f5f7" stroke="#7b8494" stroke-width="2.5"/><text x="670" y="425" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">B #2</text><text x="80" y="510" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">작업자는 &#x27;적재 시각이 빠른 순&#x27;으로 200건 선점</text><text x="80" y="550" font-size="21" font-weight="700" fill="#c0392b" text-anchor="start" xml:space="preserve">→ A #3은 들어가고 A #2는 다음 선점으로 밀림</text><rect x="80" y="590" width="120" height="54" rx="10" fill="#fff4e0" stroke="#c47a12" stroke-width="2.5"/><text x="140" y="625" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #3</text><text x="220" y="625" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">앞 순번(#2)이 없음 → 순번 대기, 5초 뒤 재시도</text><rect x="80" y="670" width="120" height="54" rx="10" fill="#fff4e0" stroke="#c47a12" stroke-width="2.5"/><text x="140" y="705" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #4</text><text x="220" y="705" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">같은 묶음의 뒤 순번도 5초 뒤로 되돌림</text><text x="80" y="790" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">#2가 저장돼도 #3 하나만 깨움, #4 이후는 계속 대기</text><rect x="80" y="840" width="830" height="160" rx="12" fill="#fdecea"/><text x="110" y="890" font-size="26" font-weight="800" fill="#c0392b" text-anchor="start" xml:space="preserve">9,000건 비우기: 44%가 한 번 이상 재시도</text><text x="110" y="940" font-size="24" font-weight="700" fill="#c0392b" text-anchor="start" xml:space="preserve">처리 속도 53건/초 (왕복만 줄였을 때)</text><rect x="980" y="160" width="890" height="880" rx="16" fill="#f3faf5" stroke="#2f8a57" stroke-width="2.5"/><text x="1010" y="205" font-size="28" font-weight="800" fill="#2f8a57" text-anchor="start" xml:space="preserve">이후: 한 배치는 같은 적재 시각</text><text x="1010" y="260" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">묶음은 나눠도 시각은 배치 시작 시각 하나로 통일</text><text x="1010" y="330" font-size="21" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">모든 묶음 · 12:00:00.425</text><rect x="1260" y="300" width="120" height="54" rx="10" fill="#eaf6ef" stroke="#2f8a57" stroke-width="2.5"/><text x="1320" y="335" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #1</text><rect x="1400" y="300" width="120" height="54" rx="10" fill="#eaf6ef" stroke="#2f8a57" stroke-width="2.5"/><text x="1460" y="335" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">B #1</text><rect x="1540" y="300" width="120" height="54" rx="10" fill="#eaf6ef" stroke="#2f8a57" stroke-width="2.5"/><text x="1600" y="335" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #2</text><rect x="1260" y="390" width="120" height="54" rx="10" fill="#eaf6ef" stroke="#2f8a57" stroke-width="2.5"/><text x="1320" y="425" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">B #2</text><rect x="1400" y="390" width="120" height="54" rx="10" fill="#eaf6ef" stroke="#2f8a57" stroke-width="2.5"/><text x="1460" y="425" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #3</text><rect x="1540" y="390" width="120" height="54" rx="10" fill="#eaf6ef" stroke="#2f8a57" stroke-width="2.5"/><text x="1600" y="425" font-size="22" font-weight="700" fill="#1f2430" text-anchor="middle" xml:space="preserve">A #4</text><text x="1010" y="510" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">시각이 같으면 &#x27;순번이 작은 것부터&#x27; 정렬</text><text x="1010" y="550" font-size="21" font-weight="700" fill="#2f8a57" text-anchor="start" xml:space="preserve">→ 같은 세션의 앞 순번이 항상 먼저 선점됨</text><text x="1010" y="625" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">+ 앞 순번이 저장되면 그 세션의 뒤 대기 행을</text><text x="1030" y="660" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">모두 함께 깨움 (예전: 바로 다음 1건만)</text><text x="1010" y="720" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">+ 순번 대기 재시도는 1초부터 (예전 5초)</text><text x="1010" y="790" font-size="21" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">세션 안 순서 규칙·충돌 검사는 그대로</text><rect x="1010" y="840" width="830" height="160" rx="12" fill="#e3f3e8"/><text x="1040" y="890" font-size="26" font-weight="800" fill="#2f8a57" text-anchor="start" xml:space="preserve">9,000건 비우기: 219건/초 (이전 코드 34.7)</text><text x="1040" y="940" font-size="24" font-weight="700" fill="#2f8a57" text-anchor="start" xml:space="preserve">초당 200건 유입에서 평균 대기 48.8초 → 2.9초</text><path d="M940,600 L980,600" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/></svg>